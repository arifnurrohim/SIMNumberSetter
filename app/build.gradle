plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystore = System.getenv("KEYSTORE")
def hasReleaseKeystore = releaseKeystore != null && file(releaseKeystore).exists()
def releaseStorePass = System.getenv("STORE_PASS")
def releaseKeyAlias = System.getenv("KEY_ALIAS") ?: "simsetter"
def releaseKeyPass = System.getenv("KEY_PASS") ?: releaseStorePass
def envVersionCode = System.getenv("VERSION_CODE")
def envVersionName = System.getenv("VERSION_NAME")

android {
    compileSdk 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "app.arifnurrohim.simsetter"
        minSdk 26
        targetSdk 32
        versionCode envVersionCode != null ? envVersionCode.toInteger() : 3
        versionName envVersionName ?: "1.2-dualsim"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.github.KieronQuinn:MonetCompat:0.4.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'io.insert-koin:koin-android:3.1.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
    implementation 'com.github.topjohnwu.libsu:core:3.2.1'
    compileOnly project(path: ':systemstubs')
    compileOnly 'de.robv.android.xposed:api:82'
}